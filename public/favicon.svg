<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="55%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background pill -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- glass top shine -->
  <rect width="64" height="32" rx="16" fill="url(#shine)"/>

  <!-- J lettermark -->
  <text
    x="32" y="44"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="40"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    letter-spacing="-1"
  >J</text>

  <!-- sparkle top-right -->
  <g transform="translate(46, 10)" fill="white" opacity="0.9">
    <polygon points="4,0 4.8,3.2 8,4 4.8,4.8 4,8 3.2,4.8 0,4 3.2,3.2" />
  </g>

  <!-- tiny sparkle bottom-left -->
  <g transform="translate(10, 46)" fill="white" opacity="0.55">
    <polygon points="2.5,0 3,1.8 4.5,2.5 3,3.2 2.5,4.5 2,3.2 0,2.5 2,1.8" />
  </g>
</svg>
